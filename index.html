<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:#000;border:0}

<nav id="nv"></nav>
<script type="text/plain" id="gs">const H={Tracker:0,Meal_Log:0,Workout_Log:0,Ingredients_DB:0,Weekly_Summary:0};
function doPost(e){var d=JSON.parse(e.postData.contents),ss=SpreadsheetApp.getActiveSpreadsheet();
for(var n in H){var rows=d.sheets[n];if(!rows||!rows.length)continue;var sh=ss.getSheetByName(n)||ss.insertSheet(n);sh.clear();sh.getRange(1,1,rows.length,rows[0].length).setValues(rows);}
var s=ss.getSheetByName('_State')||ss.insertSheet('_State');s.clear();var j=JSON.stringify(d.state),a=[];
for(var i=0;i<j.length;i+=40000)a.push([j.substr(i,40000)]);s.getRange(1,1,a.length,1).setValues(a);s.hideSheet();
return ContentService.createTextOutput('{"ok":1}').setMimeType(ContentService.MimeType.JSON);}
function doGet(){var s=SpreadsheetApp.getActiveSpreadsheet().getSheetByName('_State'),t='{}';
if(s)t=s.getDataRange().getValues().map(function(r){return r[0]}).join('');
return ContentService.createTextOutput(t).setMimeType(ContentService.MimeType.JSON);}</script>
<script>
const $=i=>document.getElementById(i),r0=Math.round,r1=x=>Math.round(x*10)/10,TD=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DB0=[["chai (prepared with milk & sugar)",2,9,3.5,75],["milk (whole)",3.3,4.7,3.2,60],["sugar",0,100,0,387],["coke (regular)",0,10.6,0,42],["thumbs up / thums up",0,10.5,0,42],["coke zero / diet coke",0,0,0,0],["chicken breast (raw)",23,0,1.2,110],["chicken breast (cooked)",31,0,3.6,165],["oil (mustard / vegetable / olive)",0,0,100,884],["ghee",0,0,99.5,898],["pasta (dry raw, any shape)",13,75,1.5,370],["pasta (boiled cooked)",5,25,1.1,130],["rice (cooked basmati)",2.7,28,0.3,130],["isabgol (psyllium husk)",2.5,10,0.5,180],["chapati / roti (plain tawa, dry)",9,50,3,265],["dal tadka",4.7,11.8,3.7,100],["rajma (cooked curry)",6.5,16,2.5,110],["chole (cooked curry)",7.5,24,4.5,165],["paneer butter masala",10.2,8.6,13.5,197],["kadai paneer",11,7,12,180],["palak paneer",8.5,5.5,10,145],["aloo gobi",2.5,12,5,100],["tomato (raw)",0.9,3.9,0.2,18],["paneer (raw)",18,4,22,280],["pasta dry olev kitchen",10.5,76,3,357],["almond milk (unsweetened)",0.5,0.3,1.2,15],["protein shake (1 scoop)",25,3,1.5,125],["banana (medium)",1.1,23,0.3,100]];
function def(){return{meals:[],lifts:[],cardio:[],weights:{},foods:[],recipes:[],del:[],set:{theme:'dark',url:'',start:'2026-10-19',kcal:1850,pro:150,carb:200,fmin:50,fmax:60,unit:'kg',speed:6,rest:240}}}
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem('ml')||'{}'))}catch(e){S=def()}
const persist=()=>{try{localStorage.setItem('ml',JSON.stringify(S))}catch(e){}};
let st;function save(){persist();clearTimeout(st);if(S.set.url&&navigator.onLine)st=setTimeout(sync,3000)}
const foods=()=>DB0.map(a=>({n:a[0],p:a[1],c:a[2],f:a[3],k:a[4]})).concat(S.foods);
let D=TD(),tab='today',sub='s',PR=[],PM='meal',SEL=null,QR=[];
const STOP=/^(of|with|the|and|gm|gms|gram|grams|ml)$/;
function cands(q){const t=(q.toLowerCase().match(/[a-z]{2,}/g)||[]).filter(x=>!STOP.test(x));return foods().map(x=>{const n=x.n.toLowerCase();return[t.filter(w=>n.includes(w)).length-n.length/1e3,x]}).filter(a=>a[0]>.5).sort((a,b)=>b[0]-a[0]).slice(0,6)}
const TAG=/\b(raw|cooked|dry|boiled|uncooked|prepared)\b/i;
function parse(t){return t.split(/[\n,;•]|\s\+\s|\sand\s/i).map(s=>s.trim().replace(/^[-*•]+\s*/,'').replace(/^\d+[.)]\s+/,'')).filter(Boolean).map(s=>{let m=s.match(/(\d+(?:\.\d+)?)\s*(g|gm|gms|gram|grams|ml)?\b/i),g=100,nm=s;if(m){g=+m[1];nm=s.replace(m[0],' ');if(!m[2])g*=100}
const cs=cands(nm),amb=cs.length>1&&!TAG.test(nm)&&cs.filter(a=>a[0]>=cs[0][0]-.5&&TAG.test(a[1].n)).length>1;return{raw:s,g,cs:cs.map(a=>a[1]),amb,pick:!amb&&cs[0]?0:-1}})}
const mac=(f,g)=>({k:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100});
function addMeal(n,g,m,mt){S.meals.push({id:uid(),d:D,mt,n,g:r1(g),k:r1(m.k),p:r1(m.p),c:r1(m.c),f:r1(m.f)})}
function dm(d){const a={k:0,p:0,c:0,f:0,n:0};S.meals.filter(x=>x.d==d).forEach(x=>{a.k+=x.k;a.p+=x.p;a.c+=x.c;a.f+=x.f;a.n++});return a}
const cb=d=>S.cardio.filter(x=>x.d==d).reduce((a,x)=>({k:a.k+x.kcal,m:a.m+x.km,t:a.t+x.min}),{k:0,m:0,t:0});
const vol=d=>S.lifts.filter(x=>x.d==d&&x.type!='Warmup').reduce((a,x)=>a+x.w*x.r,0);
const delr=(k,id)=>{S[k]=S[k].filter(x=>x.id!=id);S.del.push(id);save();render()};
function split(a){const t=a.p*4+a.c*4+a.f*9||1;return[a.p*4/t,a.c*4/t,a.f*9/t].map(x=>r0(x*100))}
const bar=(l,v,t,u,c)=>`<div class=bl><b>${l}</b><span>${r0(v)} / ${t}${u}</span></div><div class=tr><i style="width:${Math.min(100,v/t*100)}%;${c?'background:'+c+';box-shadow:0 0 10px '+c:''}"></i></div>`;
function nav(){$('nv').innerHTML=[['today','🍽','Today'],['lift','🏋','Lift'],['cardio','🚶','Cardio'],['stats','📊','Weeks'],['more','⚙','More']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';render()">${a[1]}<br>${a[2]}</button>`).join('')}
const dnav=()=>`<div class=r><button onclick="sd(-1)">‹</button><input type=date value="${D}" onchange="D=this.value;render()"><button onclick="sd(1)">›</button></div>`;
function sd(n){const d=new Date(D+'T12:00');d.setDate(d.getDate()+n);D=d.toLocaleDateString('en-CA');render()}
function render(){document.documentElement.dataset.theme=S.set.theme;nav();$('v').innerHTML=({today:vToday,lift:vLift,cardio:vCardio,stats:vStats,more:vMore})[tab]()}
const MTS=['Breakfast','Lunch','Dinner','Snack'],mtd=()=>{const h=new Date().getHours();return h<11?0:h<16?1:h<21?2:3};
function vToday(){const a=dm(D),c=cb(D),s=S.set,sp=split(a),h=nmHint();
const list=MTS.map(mt=>{const L=S.meals.filter(x=>x.d==D&&x.mt==mt);return L.length?`<h3>${mt} · ${r0(L.reduce((t,x)=>t+x.k,0))} kcal</h3>`+L.map(x=>`<div class=row><span>${esc(x.n)}<br><span class=mu>${r0(x.g)}g · P${r0(x.p)} C${r0(x.c)} F${r0(x.f)}</span></span><b>${r0(x.k)}</b><button class=x onclick="delr('meals','${x.id}')">✕</button></div>`).join(''):''}).join('');
return dnav()+`<div class=c><h2>${r0(a.k)} kcal <span class=mu>· burned ${r0(c.k)} cardio</span></h2>${bar('Calories',a.k,s.kcal,' kcal',a.k>s.kcal?'var(--er)':'')}${bar('Protein (floor)',a.p,s.pro,'g',a.p>=s.pro?'var(--ok)':'')}${bar('Carbs',a.c,s.carb,'g')}${bar('Fat ('+s.fmin+'–'+s.fmax+'g)',a.f,s.fmax,'g',a.f>s.fmax?'var(--er)':'')}<p class=mu>Split by kcal: <b>${sp[0]}% P</b> · <b>${sp[1]}% C</b> · <b>${sp[2]}% F</b></p>
<div class=r><input id=wt type=number step=.1 placeholder="Weight (${s.unit})" value="${S.weights[D]||''}"><button onclick="S.weights[D]=+$('wt').value||undefined;save();render()">Save</button></div></div>
<div class=c><div class=tabs>${[['s','Search'],['t','Text'],['r','Recipe']].map(a=>`<button class="${sub==a[0]?'on':''}" onclick="sub='${a[0]}';PR=[];render()">${a[1]}</button>`).join('')}</div>
<select id=mt>${MTS.map((m,i)=>`<option ${i==mtd()?'selected':''}>${m}</option>`).join('')}</select>${vAdd()}<div id=pr>${rev()}</div></div>`+(list?`<div class=c>${list}</div>`:'')}
const nmHint=()=>'';
function vAdd(){if(sub=='s')return`<div class=r><input id=q placeholder="Search food…" oninput="sq()"></div><div id=qr></div><div id=sel></div>`;
if(sub=='t')return`<textarea id=tx placeholder="chicken breast (cooked) 200g, rice (cooked basmati) 150g"></textarea><div class=r><button class=p onclick="PM='meal';PR=parse($('tx').value);$('pr').innerHTML=rev()">Parse</button></div>`;
return S.recipes.map((r,i)=>{const t=rt(r);return`<div class=row style="flex-wrap:wrap"><span><b>${esc(r.name)}</b><br><span class=mu>${r0(t.k)} kcal · P${r0(t.p)} C${r0(t.c)} F${r0(t.f)} · yield ${r.y}g</span></span><button class=x onclick="S.recipes.splice(${i},1);save();render()">✕</button><div class=r style="width:100%"><input id=pc${i} type=number placeholder="% of batch eaten"><input id=cg${i} type=number placeholder="or cooked g"><button class=p onclick="ar(${i})">Add</button></div></div>`}).join('')+`<h3>New recipe</h3><input id=rn placeholder="Name"><textarea id=ri placeholder="450g chicken breast raw, 180g pasta dry, 15g oil"></textarea><input id=ry type=number placeholder="Cooked yield (g)"><div class=r><button class=p onclick="PM='rec';PR=parse($('ri').value);$('pr').innerHTML=rev()">Parse ingredients</button></div>`}
const rt=r=>r.i.reduce((a,x)=>{const m=mac(x,x.g);return{k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}},{k:0,p:0,c:0,f:0});
function ar(i){const r=S.recipes[i],cg=+$('cg'+i).value,fr=cg?cg/r.y:(+$('pc'+i).value||0)/100;if(!fr)return;const t=rt(r),m={k:t.k*fr,p:t.p*fr,c:t.c*fr,f:t.f*fr};addMeal(r.name+' ('+r0(fr*100)+'%)',r.y*fr,m,$('mt').value);save();render()}
function sq(){QR=$('q').value.trim()?cands($('q').value).map(a=>a[1]):[];$('qr').innerHTML=QR.map((f,i)=>`<div class=row onclick="ps(${i})" style="cursor:pointer"><span>${esc(f.n)}</span><span class=mu>${r0(f.k)} kcal/100g</span></div>`).join('')}
function ps(i){SEL=QR[i];$('qr').innerHTML='';$('sel').innerHTML=`<b>${esc(SEL.n)}</b><div class=r><input id=sg type=number value=100 oninput="sm()"><span id=smc class=mu></span><button class=p onclick="addSel()">Add</button></div>`;sm()}
function sm(){const m=mac(SEL,+$('sg').value||0);$('smc').textContent=`${r0(m.k)} kcal · P${r0(m.p)} C${r0(m.c)} F${r0(m.f)}`}
function addSel(){const g=+$('sg').value;if(!g)return;addMeal(SEL.n,g,mac(SEL,g),$('mt').value);save();render()}
function rev(){if(!PR.length)return'';return PR.map((p,i)=>`<div class=row style="flex-wrap:wrap"><span class=mu style="width:100%">${esc(p.raw)}${p.amb?' <b class=er>⚠ raw or cooked? choose one</b>':''}${p.cs.length?'':' <b class=er>no match</b>'}</span><div class=r style="width:100%"><select id=s${i}><option value=-1>— choose —</option>${p.cs.map((f,j)=>`<option value=${j} ${p.pick==j?'selected':''}>${esc(f.n)}</option>`).join('')}</select><input id=g${i} type=number value=${p.g} style="max-width:90px"></div></div>`).join('')+`<div class=r><button class=p onclick="commit()">${PM=='meal'?'Add all':'Save recipe'}</button></div>`}
function commit(){const it=[];PR.forEach((p,i)=>{const j=+$('s'+i).value,g=+$('g'+i).value;if(j>=0&&g)it.push({f:p.cs[j],g})});
if(PM=='meal')it.forEach(x=>addMeal(x.f.n,x.g,mac(x.f,x.g),$('mt').value));else{const n=$('rn').value.trim(),y=+$('ry').value;if(!n||!y||!it.length)return alert('Need a name, cooked yield and matched ingredients');S.recipes.push({name:n,y,i:it.map(x=>({n:x.f.n,g:x.g,p:x.f.p,c:x.f.c,f:x.f.f,k:x.f.k}))})}
PR=[];save();render()}
const EX=['Bench Press','Incline DB Press','Chest Fly','Triceps Pushdown','Skull Crusher','Overhead Press','Lat Pulldown','Barbell Row','Squat','Deadlift','Bicep Curl'];
let RS=S.set.rest||240;
function last(ex){const L=S.lifts.filter(x=>x.ex==ex&&x.d<D).sort((a,b)=>a.d<b.d?1:-1);if(!L.length)return null;const d=L[0].d;return{d,s:S.lifts.filter(x=>x.ex==ex&&x.d==d)}}
function vLift(){const L=S.lifts.filter(x=>x.d==D),exs=[...new Set(L.map(x=>x.ex))],u=S.set.unit;
return dnav()+`<div class=c><h2>Log set</h2><input id=ex list=exl placeholder="Exercise" oninput="lx()"><datalist id=exl>${[...new Set(EX.concat(S.lifts.map(x=>x.ex)))].map(e=>`<option>${esc(e)}</option>`).join('')}</datalist><div id=ls class=mu></div>
<div class=r><input id=lw type=number step=.25 placeholder="${u}"><input id=lr type=number placeholder="reps"><input id=lp type=number step=.5 max=10 placeholder="RPE"></div>
<div class=r><select id=lt><option>Working Set</option><option>Warmup</option><option>To Failure</option></select><button class=p onclick="addSet()">Log + rest</button></div>
<div class=r>${[120,180,240].map(s=>`<button class="${RS==s?'p':''}" onclick="RS=${s};S.set.rest=${s};save();render()">${s/60} min</button>`).join('')}<button onclick="tstart(RS)">▶ Timer</button></div></div>`+
exs.map(e=>{const X=L.filter(x=>x.ex==e);return`<div class=c><h2>${esc(e)} <span class=mu>vol ${r0(X.filter(x=>x.type!='Warmup').reduce((a,x)=>a+x.w*x.r,0))}</span></h2>${X.map(x=>`<div class=row><span>#${x.n} · ${x.w}${u} × ${x.r} <span class=mu>${x.type!='Working Set'?x.type:''} ${x.rpe?'RPE'+x.rpe:''}</span></span><button class=x onclick="delr('lifts','${x.id}')">✕</button></div>`).join('')}</div>`}).join('')+
`<div class=c><h2>Plate calculator</h2><div class=r><input id=pt type=number placeholder="Target ${u}" oninput="pc()"><input id=pb type=number value=${u=='kg'?20:45} oninput="pc()"></div><div id=po></div></div>`}
function lx(){const ex=$('ex').value,l=last(ex);$('ls').innerHTML=l?`Last (${l.d}): ${l.s.map(x=>x.w+'×'+x.r).join(', ')}`:'';if(l){const z=l.s[l.s.length-1];$('lw').value=z.w;$('lr').value=z.r}}
function addSet(){const ex=$('ex').value.trim(),w=+$('lw').value,r=+$('lr').value;if(!ex||!r)return;const n=S.lifts.filter(x=>x.d==D&&x.ex==ex).length+1;S.lifts.push({id:uid(),d:D,ex,n,w,r,rpe:+$('lp').value||'',type:$('lt').value,rest:RS});save();tstart(RS);const x=$('ex').value,a=$('lw').value,b=$('lr').value;render();$('ex').value=x;$('lw').value=a;$('lr').value=b;lx()}
function pc(){const u=S.set.unit,T=+$('pt').value,B=+$('pb').value,P=u=='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];let s=(T-B)/2,o=[];if(s<0){$('po').textContent='Below bar weight';return}P.forEach(p=>{while(s>=p-1e-9){o.push(p);s-=p}});$('po').innerHTML=`<div class=pl><b style="background:var(--mu)">BAR</b>${o.map(p=>`<b style="padding:${8+p/(u=='kg'?2.5:4)}px 3px">${p}</b>`).join('')}</div><p class=mu>Per side: ${o.join(' + ')||'—'}${s>.01?` (short ${r1(s*2)}${u})`:''}</p>`}
let T0=0,TI;function tstart(s){RS=s;T0=Date.now()+s*1e3;clearInterval(TI);TI=setInterval(tick,250);tick()}
function tstop(){clearInterval(TI);$('tm').style.display='none'}
function tick(){const l=Math.ceil((T0-Date.now())/1e3);if(l<=0){tstop();beep();return}$('tm').style.display='flex';$('tt').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0')}
function beep(){try{navigator.vibrate&&navigator.vibrate([250,120,250,120,250]);const a=new AudioContext();[0,.3,.6].forEach(t=>{const o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start(a.currentTime+t);o.stop(a.currentTime+t+.18)})}catch(e){}}
function vCardio(){const L=S.cardio.filter(x=>x.d==D),sp=S.set.speed;return dnav()+`<div class=c><h2>Log cardio</h2><select id=ct><option>Zone 2 Walk</option><option>Incline Walk</option><option>Treadmill Run</option><option>Other</option></select><div class=r><input id=cm type=number placeholder="Minutes" oninput="ce()"><input id=ck2 type=number step=.01 placeholder="km"><input id=cc type=number placeholder="kcal"></div><p class=mu>Walk preset ${sp} km/h: distance auto-fills from minutes; kcal estimate ≈ 60 kcal/km (editable).</p><button class=p onclick="addC()">Log</button></div>`+(L.length?`<div class=c>${L.map(x=>`<div class=row><span>${esc(x.t)} · ${x.min} min · ${x.km} km<br><span class=mu>${x.kcal} kcal</span></span><button class=x onclick="delr('cardio','${x.id}')">✕</button></div>`).join('')}</div>`:'')}
function ce(){const m=+$('cm').value,k=r1(m*S.set.speed/60);$('ck2').value=k;$('cc').value=r0(k*60)}
function addC(){const min=+$('cm').value;if(!min)return;S.cardio.push({id:uid(),d:D,t:$('ct').value,min,km:+$('ck2').value||0,kcal:+$('cc').value||0});save();render()}
const dates=()=>[...new Set([...S.meals,...S.lifts,...S.cardio].map(x=>x.d).concat(Object.keys(S.weights)))].sort();
function dayRow(d){const a=dm(d),c=cb(d);return{d,a,c,w:S.weights[d]||'',v:vol(d)}}
function weeks(){const o=[],s=Date.parse(S.set.start);for(let i=0;i<36;i++){const ds=dates().filter(d=>Math.floor((Date.parse(d)-s)/864e5/7)==i).map(dayRow),L=ds.filter(x=>x.a.n),n=L.length,av=k=>n?r0(L.reduce((t,x)=>t+x.a[k],0)/n):'',hit=L.filter(x=>x.a.k<=S.set.kcal&&x.a.p>=S.set.pro).length;o.push([i+1,new Date(s+i*6048e5).toLocaleDateString('en-CA'),n,av('k'),av('p'),av('c'),av('f'),r1(ds.reduce((t,x)=>t+x.c.m,0)),r0(ds.reduce((t,x)=>t+x.c.k,0)),r0(ds.reduce((t,x)=>t+x.v,0)),hit+'/'+n])}return o}
function vStats(){return`<div class=c><h2>36-week summary</h2><p class=mu>Start ${S.set.start}. Hit = kcal ≤ ${S.set.kcal} and protein ≥ ${S.set.pro}g.</p><div style="overflow-x:auto"><table><tr><th>Wk</th><th>Days</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th>km</th><th>burn</th><th>Vol</th><th>Hit</th></tr>${weeks().map(w=>`<tr><td>${w[0]}</td><td>${w[2]}</td><td>${w[3]}</td><td>${w[4]}</td><td>${w[5]}</td><td>${w[6]}</td><td>${w[7]}</td><td>${w[8]}</td><td>${w[9]}</td><td class=${w[2]&&+w[10].split('/')[0]*2>=w[2]?'ok':''}>${w[10]}</td></tr>`).join('')}</table></div></div>`}
function sheets(){const T=[['Date','Kcal','Weight','Protein','Carbs','Fat','Macro Split % P/C/F','Cardio Burn','Cardio km','Lifting Volume']];dates().forEach(d=>{const x=dayRow(d);T.push([d,r0(x.a.k),x.w,r0(x.a.p),r0(x.a.c),r0(x.a.f),split(x.a).join('/'),x.c.k,r1(x.c.m),r0(x.v)])});
return{Tracker:T,Meal_Log:[['Date','Meal Type','Food','Grams','Kcal','Protein','Carbs','Fat']].concat(S.meals.map(x=>[x.d,x.mt,x.n,x.g,x.k,x.p,x.c,x.f])),Workout_Log:[['Date','Exercise','Set #','Weight','Reps','Failure Flag','RPE','Type','Rest (s)']].concat(S.lifts.map(x=>[x.d,x.ex,x.n,x.w,x.r,x.type=='To Failure'?'Y':'',x.rpe,x.type,x.rest])),Ingredients_DB:[['Food','Protein','Carbs','Fat','Kcal (per 100g)']].concat(foods().map(f=>[f.n,f.p,f.c,f.f,f.k])),Weekly_Summary:[['Week','Start','Days Logged','Avg Kcal','Avg P','Avg C','Avg F','Cardio km','Cardio kcal','Lift Vol','Target Hit Days']].concat(weeks())}}
function merge(j){const dl=new Set(S.del.concat(j.del||[]));S.del=[...dl];['meals','lifts','cardio'].forEach(k=>{const ids=new Set(S[k].map(x=>x.id));(j[k]||[]).forEach(x=>{if(!ids.has(x.id))S[k].push(x)});S[k]=S[k].filter(x=>!dl.has(x.id))});Object.keys(j.weights||{}).forEach(d=>{if(!(d in S.weights))S.weights[d]=j.weights[d]});(j.foods||[]).forEach(f=>{if(!S.foods.some(x=>x.n==f.n))S.foods.push(f)});(j.recipes||[]).forEach(r=>{if(!S.recipes.some(x=>x.name==r.name))S.recipes.push(r)})}
const stt=m=>{const e=$('sst');if(e)e.textContent=m};
async function sync(){const u=S.set.url;if(!u)return stt('Add your Web App URL first');stt('Syncing…');try{try{const r=await fetch(u+(u.includes('?')?'&':'?')+'a=pull');merge(await r.json());persist()}catch(e){}
await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({sheets:sheets(),state:S})});stt('Synced '+new Date().toLocaleTimeString());if(tab!='more')render()}catch(e){stt('Offline — will retry when online')}}
addEventListener('online',()=>S.set.url&&sync());
function vMore(){const s=S.set,f=(k,l,t='number')=>`<div class=r><span style="flex:1.2">${l}</span><input type=${t} value="${s[k]}" onchange="S.set.${k}=${t=='number'?'+this.value':'this.value'};save()"></div>`;
return`<div class=c><h2>Appearance</h2><select onchange="S.set.theme=this.value;save();render()">${[['light','Light'],['dark','Dark'],['amoled','True AMOLED']].map(a=>`<option value=${a[0]} ${s.theme==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div>
<div class=c><h2>Targets</h2>${f('kcal','Kcal')}${f('pro','Protein floor g')}${f('carb','Carbs g')}${f('fmin','Fat min g')}${f('fmax','Fat max g')}${f('speed','Walk km/h')}${f('start','Program start (Mon)','date')}<div class=r><span>Units</span><select onchange="S.set.unit=this.value;save()"><option ${s.unit=='kg'?'selected':''}>kg</option><option ${s.unit=='lbs'?'selected':''}>lbs</option></select></div></div>
<div class=c><h2>Custom food (per 100g)</h2><input id=fn placeholder="Name, e.g. paneer (raw)"><div class=r><input id=fp type=number placeholder="P"><input id=fc type=number placeholder="C"><input id=ff type=number placeholder="F"><input id=fk type=number placeholder="kcal"></div><button class=p onclick="S.foods.push({n:$('fn').value,p:+$('fp').value,c:+$('fc').value,f:+$('ff').value,k:+$('fk').value});save();render()">Add food</button></div>
<div class=c><h2>Google Sheets sync</h2><input placeholder="Apps Script Web App URL (…/exec)" value="${esc(s.url)}" onchange="S.set.url=this.value.trim();save()"><div class=r><button class=p onclick="sync()">Sync now</button><button onclick="navigator.clipboard.writeText($('gs').textContent);alert('Code.gs copied')">Copy Code.gs</button></div><p class=mu id=sst></p><p class=mu>Paste Code.gs in Extensions → Apps Script, Deploy → Web app (execute as you, access anyone), paste the /exec URL here. Data is stored locally first and syncs when online.</p></div>
<div class=c><button onclick="const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='macrolift-backup.json';a.click()">Export JSON</button> <button class=x onclick="if(confirm('Erase all local data?')){localStorage.removeItem('ml');location.reload()}">Reset</button></div>`}
if(!S.seeded){S.seeded=1;[['Chicken tomato pasta','450g chicken breast raw, 180g pasta dry olev, 18g oil, 400g tomato raw',955],['Paneer gravy pasta','400g paneer raw, 300g pasta dry olev, 200ml almond milk, 10g oil',1200]].forEach(a=>{const it=parse(a[1]).filter(p=>p.cs.length).map(p=>{const f=p.cs[Math.max(0,p.pick)];return{n:f.n,g:p.g,p:f.p,c:f.c,f:f.f,k:f.k}});if(it.length)S.recipes.push({name:a[0],y:a[2],i:it})});persist()}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
